<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalai Icons has moved</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://kalaicons.github.io/" />
  <meta http-equiv="refresh" content="0; url=https://kalaicons.github.io/" />
  <script>
    // Keep the rest of the address, e.g. /kalai-icons/icon/user → kalaicons.github.io/icon/user
    var prefix = '/kalai-icons';
    var path = location.pathname;
    if (prefix && path.indexOf(prefix) === 0) path = path.slice(prefix.length) || '/';
    location.replace('https://kalaicons.github.io' + path + location.search + location.hash);
  </script>
  <style>body{font:16px/1.5 system-ui,sans-serif;margin:48px 16px;text-align:center}a{color:#1463FD}</style>
</head>
<body>
  <p>Kalai Icons has moved to <a href="https://kalaicons.github.io/">kalaicons.github.io</a>.</p>
</body>
</html>
